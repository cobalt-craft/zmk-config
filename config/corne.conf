# Corne shield config tuning. Most defaults are fine; uncomment to enable extras.

# OLED display on the Corne_Oled_RGB (the controller has an SSD1306 OLED).
# Without this the OLEDs stay dark on first flash.
CONFIG_ZMK_DISPLAY=y

# Bluetooth: bump TX power for stronger split-half radio link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep behavior: send halves to deep sleep after 15 minutes of idle to save battery.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment to enable USB serial logging (visible at /dev/ttyACM* when wired).
# Useful for debugging hold-tap timing or combo behavior.
# CONFIG_ZMK_USB_LOGGING=y

# RGB underglow on the Corne LP — the shield devicetree already declares
# the WS2812 strip, so only the ZMK feature flag is needed. Older docs
# also listed CONFIG_WS2812_STRIP and CONFIG_SPI, but those symbols were
# auto-selected in the Zephyr 4.1 migration and now error on assignment.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Power tuning — LEDs are the single biggest battery drain on a wireless
# Corne. Idle-off shuts them down with the rest of the keyboard, and
# starting at 40% brightness avoids the wall-of-light first impression
# while still being visibly lit on a dim desk.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40

# Persist RGB state (on/off, effect, brightness, color) across reboots so
# the keyboard remembers user preference instead of resetting to default
# every time the halves wake up.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Tried decoupling ext-power from underglow (CONFIG_ZMK_EXT_POWER=y +
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n) — that made things worse: ext-
# power has no initial-on setting, so the LED + OLED rail defaulted off
# and the working right-side LEDs went dark too. Leaving the default
# coupling in place — underglow on = ext-power on = right LEDs work.
# Left LEDs + OLEDs staying dark is likely hardware-side (specific to
# the KeebMaker assembly); revisit with the PCB in hand.
