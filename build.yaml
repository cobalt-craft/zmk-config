# GitHub Actions build matrix. Each entry produces one .uf2 firmware file.
# A split keyboard needs both halves built separately — they run different
# firmware (one is the BLE central, one is the peripheral).
include:
  # Board name format changed with the Zephyr 4.1 migration (Dec 2025):
  # `nice_nano_v2` -> `nice_nano@2.0.0//zmk` (short form: `nice_nano//zmk`).
  # See https://zmk.dev/blog/2025/12/09/zephyr-4-1#zmk-board-variant
  - board: nice_nano//zmk
    shield: corne_left
    # ZMK Studio runs on the central (left) half ONLY. The snippet wires up
    # the USB CDC-ACM serial endpoint the Studio web app talks to over the
    # cable; the cmake-arg compiles the Studio feature in. Putting it here
    # (not in corne.conf) keeps it off the peripheral + settings_reset builds.
    # Do NOT also enable CONFIG_ZMK_USB_LOGGING — it fights for the same CDC.
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: corne_right
  # Settings reset firmware: flash this onto a half to wipe paired BT keys
  # if the halves stop talking to each other or won't pair to a host.
  - board: nice_nano//zmk
    shield: settings_reset
